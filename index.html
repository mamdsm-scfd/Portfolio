    <!-- Apply saved theme and language before first paint (no flash) -->
    <script>
      (function () {
        var d = document.documentElement, t, l;
        try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (l !== 'ar' && l !== 'en') l = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        d.dataset.theme = t; d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
